<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders Registration</title>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            color: black;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;     /* ensures it fills without distortion */
            z-index: -1;
        }

        .register-container {
            z-index: 1;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            color: #333;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            background: #7567f7;/*linear-gradient(90deg, #5395eb, #56a7f3, #75bbfd);*/
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradient-flow 4s infinite alternate;
        }

        input[type="email"], input[type="password"] {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            outline: none;
        }

        button {
            width: 90%;
            padding: 15px;
            margin: 20px 0;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #5395eb, #56a7f3, #75bbfd);
            color: white;
            opacity: 10;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: linear-gradient(90deg, #3e88e9, #1182ec, #3e88e9);
        }

        a {
            color: #fbc531;
            text-decoration: none;
            font-size: 1em;
        }

        #playBtn {
            position: absolute;
            top: -2vh;
            left: 175vb;
            width: 30vb;
            background: linear-gradient(90deg, #c316da, #e0109b, #bd1df2);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        #playBtn:hover {
            background: linear-gradient(90deg, #e0109b, #c316da, #e0109b);
        }
    </style>
</head>
<body>
    <!-- Place iframe in the background -->
    <!-- <iframe id='gameCanvas' src="{{ url_for('main.wham') }}"></iframe> -->
    <video autoplay muted loop src="https://raw.githubusercontent.com/Singhom931/CargoLoadingWeb/v2/app/static/resources/background.mp4" preload="auto" type="video/mp4"> </video>

    <div class="register-container">
        <h1>Register</h1>
        <form id="register-form" method="POST">
            <input type="email" name="email" placeholder="Enter your email" required>
            <input type="password" name="password" placeholder="Enter your password" required>
            <input type="password" name="repeatpassword" placeholder="Enter your password again" required>
            <button type="submit">Register</button>
        </form>
    </div>
    
</body>
</html>
