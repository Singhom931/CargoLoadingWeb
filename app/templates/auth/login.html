<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Train Login</title>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            color: white;
            perspective: 1000px; /* Adds 3D depth */
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;     /* ensures it fills without distortion */
            z-index: -1;
        }

        .login-container {
            z-index: 1;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            color: #333;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            background: #7567f7;/*linear-gradient(90deg, #5395eb, #56a7f3, #75bbfd);*/
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradient-flow 4s infinite alternate;
        }

        @keyframes gradient-flow {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        input[type="email"], input[type="password"] {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            outline: none;
        }

        button {
            width: 90%;
            padding: 15px;
            margin: 20px 0;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #5395eb, #56a7f3, #75bbfd);
            color: white;
            opacity: 10;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: linear-gradient(90deg, #3e88e9, #1182ec, #3e88e9);
        }

        a {
            color: #bb31fb;
            text-decoration: none;
            font-size: 1em;
        }

        #playBtn {
            position: absolute;
            top: 0vh;
            right: 5vb;
            width: 30vb;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s ease;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .login-container {
            transform-style: preserve-3d;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            will-change: transform;
        }

        body:hover .login-container {
            will-change: transform;
        }

    </style>
</head>
<body>
    <!-- <canvas id="gameCanvas"> </canvas> -->
    <video autoplay muted loop src="{{ url_for('static', filename='resources/background.mp4') }}" type="video/mp4"> </video>
    
    <div class="login-container">
        <h1>Welcome Back!</h1>
        <form id="login-form" method="POST">
            <input type="email" name="email" placeholder="Enter your email" required>
            <input type="password" name="password" placeholder="Enter your password" required>
            <button type="submit">Login</button>
        </form>
        <a href="register">Create Account</a> | <a href="/guest">Continue as Guest</a>
    </div>

    <script>
        const card = document.querySelector('.login-container');
        const playBtn = document.getElementById('playBtn');
    
        let playBtnHovered = false;
    
        document.addEventListener('mousemove', (e) => {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const mouseX = e.clientX;
            const mouseY = e.clientY;
    
            const rotateY = (mouseX - centerX) / 25;
            const rotateX = -(mouseY - centerY) / 25;
    
            const sharedTransform = `rotateY(${rotateY}deg) rotateX(${rotateX}deg) scale(1.03)`;
            const sharedShadow = `${-rotateY}px ${rotateX}px 30px rgba(0, 0, 0, 0.2)`;
    
            // Apply tilt to login container
            card.style.transform = sharedTransform;
            card.style.boxShadow = sharedShadow;
    
            // Only sync playBtn when not hovered
            if (!playBtnHovered) {
                playBtn.style.transform = sharedTransform;
                playBtn.style.boxShadow = sharedShadow;
            }
        });
    
        document.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateY(0deg) rotateX(0deg) scale(1)';
            card.style.boxShadow = '0 8px 30px rgba(0, 0, 0, 0.3)';
    
            playBtn.style.transform = 'rotateY(0deg) rotateX(0deg) scale(1)';
            playBtn.style.boxShadow = '0 4px 10px rgba(0, 0, 0, 0.2)';
        });
    
        // When mouse enters play button, tilt based on its own center
        playBtn.addEventListener('mouseenter', () => {
            playBtnHovered = true;
        });
    
        playBtn.addEventListener('mousemove', (e) => {
            if (!playBtnHovered) return;
    
            const rect = playBtn.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
    
            const mouseX = e.clientX;
            const mouseY = e.clientY;
    
            const rotateY = (mouseX - centerX) / 15;
            const rotateX = -(mouseY - centerY) / 15;
    
            playBtn.style.transform = `rotateY(${rotateY}deg) rotateX(${rotateX}deg) scale(1.05)`;
            playBtn.style.boxShadow = `${-rotateY}px ${rotateX}px 20px rgba(0, 0, 0, 0.2)`;
        });
    
        playBtn.addEventListener('mouseleave', () => {
            playBtnHovered = false;
        });
    </script>
</body>
</html>
