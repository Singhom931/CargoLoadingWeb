<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
        background-color: #f5f6f8;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #333;
    }

    #loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        width: 400px;
    }

    .logo {
        font-size: 1.8rem;
        font-weight: 600;
        color: #1f2937;
        letter-spacing: 1px;
    }

    .loader-circle {
        width: 50px;
        height: 50px;
        border: 5px solid #d1d5db;
        border-top-color: #2563eb; /* subtle accent */
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    .progress-container {
        width: 100%;
        height: 12px;
        background-color: #e5e7eb;
        border-radius: 6px;
        overflow: hidden;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
    }

    .progress-bar {
        height: 100%;
        width: 0%;
        background-color: #2563eb;
        border-radius: 6px;
        transition: width 0.3s ease;
    }

    .loading-text {
        font-size: 15px;
        color: #4b5563;
        text-align: center;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
</head>
<body>

<div id="loading-screen">
    <div class="logo">Truck CO₂ Estimator</div>
    <div class="loader-circle"></div>
    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="loading-text" id="loading-text">Preparing data...</div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    const loadingTexts = [
        "Preparing data...",
        "Calculating fuel consumption...",
        "Estimating CO₂ emissions...",
        "Optimizing routes...",
        "Almost done..."
    ];

    const progressBar = document.getElementById('progress-bar');
    const loadingText = document.getElementById('loading-text');

    let textIndex = 0;
    let fakeProgress = 0;

    // Rotate loading text
    setInterval(() => {
        textIndex = (textIndex + 1) % loadingTexts.length;
        loadingText.textContent = loadingTexts[textIndex];
    }, 2500);

    // Poll server for task completion
    function checkTaskStatus() {
        $.ajax({
            url: '/check_output_status',
            method: 'GET',
            success: function(response) {
                if (response.status === 'complete') {
                    progressBar.style.width = "100%";
                    setTimeout(() => {
                        window.location.href = '/output';
                    }, 400);
                } else {
                    if(fakeProgress < 95) {
                        fakeProgress += Math.random() * 1.5;
                        if(fakeProgress > 95) fakeProgress = 95;
                        progressBar.style.width = fakeProgress + "%";
                    }
                    setTimeout(checkTaskStatus, 1000);
                }
            },
            error: function() {
                setTimeout(checkTaskStatus, 2000);
            }
        });
    }

    checkTaskStatus();
</script>

</body>
</html>
