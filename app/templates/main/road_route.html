<!DOCTYPE html>
<html>
<head>
  <title>Road Route Planner</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      height: 100vh;
      width: 100%;
    }
    .search-boxes {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 16px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    input {
      padding: 8px;
      font-size: 14px;
      width: 220px;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      background-color: #008CBA;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #0077a8;
    }
  </style>
</head>
<body>
  <div class="search-boxes">
    <input id="startInput" type="text" placeholder="Enter start location">
    <input id="endInput" type="text" placeholder="Enter destination location">
    <button onclick="calculateRoute()">Show Route</button>
  </div>

  <div id="map"></div>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAp1DBQN_zl5xbHWxECa50MGR4IputFHgY&libraries=places&callback=initMap" async defer></script>
  <script>
    let map, directionsService, directionsRenderer;
    let startMarker, endMarker;

    function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 20, lng: 78 },
        zoom: 5,
        mapTypeId: "roadmap"
    });

    directionsService = new google.maps.DirectionsService();
    directionsRenderer = new google.maps.DirectionsRenderer({ map: map });

    const startInput = document.getElementById("startInput");
    const endInput = document.getElementById("endInput");

    const startAutocomplete = new google.maps.places.Autocomplete(startInput);
    const endAutocomplete = new google.maps.places.Autocomplete(endInput);

    startAutocomplete.addListener("place_changed", () => {
        const place = startAutocomplete.getPlace();
        if (!place.geometry) return;
        placeMarker("start", place.geometry.location);
    });

    endAutocomplete.addListener("place_changed", () => {
        const place = endAutocomplete.getPlace();
        if (!place.geometry) return;
        placeMarker("end", place.geometry.location);
    });
    }

    function placeMarker(type, position) {
    if (type === "start") {
        if (startMarker) startMarker.setMap(null);
        startMarker = new google.maps.Marker({
        position,
        map,
        draggable: true,
        icon: "http://maps.google.com/mapfiles/ms/icons/green-dot.png"
        });
        startMarker.addListener("dragend", calculateRoute);
    } else {
        if (endMarker) endMarker.setMap(null);
        endMarker = new google.maps.Marker({
        position,
        map,
        draggable: true,
        icon: "http://maps.google.com/mapfiles/ms/icons/red-dot.png"
        });
        endMarker.addListener("dragend", calculateRoute);
    }

    if (startMarker && endMarker) calculateRoute();
    }

    function calculateRoute() {
    if (!directionsService || !startMarker || !endMarker) {
        console.warn("Waiting for markers and DirectionsService to be ready");
        return;
    }

    const request = {
        origin: startMarker.getPosition(),
        destination: endMarker.getPosition(),
        travelMode: google.maps.TravelMode.DRIVING,
        provideRouteAlternatives: true
    };

    directionsService.route(request, (result, status) => {
        if (status === "OK") {
        directionsRenderer.setDirections(result);
        } else {
        console.error("Directions request failed: " + status);
        }
    });
    }
  </script>
</body>
</html>
